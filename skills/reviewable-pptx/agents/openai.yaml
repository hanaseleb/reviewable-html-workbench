display_name: Reviewable PPTX / PDF
short_description: PPTX・PDFをページ単位でレビューし、位置注釈と改訂版作成まで扱う / Review and revise PPTX or PDF files.
default_prompt: Review this PPTX or PDF page by page and apply resolved feedback / このPPTXまたはPDFをページ単位でレビューして
trigger_examples:
  - PPTXをレビュー
  - PDFをレビュー
  - スライドにコメント
  - PDFにコメント
  - PowerPointを確認
  - コメントを反映してPPTXを修正
  - review this PPTX
  - review this PDF
  - review this deck
  - comment on these slides
  - revise the presentation from comments
entrypoint: python3 -m scripts.html_review_workbench.cli
working_directory: plugin_root
workflow:
  - build-pptx-review
  - build-pdf-review
  - preview
  - ingest-review
  - add-reply
  - check-gates
  - notify-update
